name: Refresh Profile Stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: profile-stats-${{ github.ref }}

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution total
        run: python3 .github/scripts/update_profile.py

      - name: Commit refreshed stats
        run: |
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Refresh GitHub profile stats"
          git push
